<div class="d-flex justify-content-center">
  <div class="col-8">
    @if (parentorganization(); as parentorganizationRef) {
      <div>
        <h2 data-cy="parentorganizationDetailsHeading">
          <span jhiTranslate="organizationBackendApp.parentorganization.detail.title">Parentorganization</span>
        </h2>

        <hr />

        <jhi-alert-error></jhi-alert-error>

        <jhi-alert></jhi-alert>

        <dl class="row-md jh-entity-details">
          <dt><span jhiTranslate="global.field.id">ID</span></dt>
          <dd>
            <span>{{ parentorganizationRef.id }}</span>
          </dd>
          <dt><span jhiTranslate="organizationBackendApp.parentorganization.name">Name</span></dt>
          <dd>
            <span>{{ parentorganizationRef.name }}</span>
          </dd>
          <dt><span jhiTranslate="organizationBackendApp.parentorganization.description">Description</span></dt>
          <dd>
            <span>{{ parentorganizationRef.description }}</span>
          </dd>
        </dl>

        <button type="submit" (click)="previousState()" class="btn btn-info" data-cy="entityDetailsBackButton">
          <fa-icon icon="arrow-left"></fa-icon>&nbsp;<span jhiTranslate="entity.action.back">Back</span>
        </button>

        <button type="button" [routerLink]="['/parentorganization', parentorganizationRef.id, 'edit']" class="btn btn-primary">
          <fa-icon icon="pencil-alt"></fa-icon>&nbsp;<span jhiTranslate="entity.action.edit">Edit</span>
        </button>
      </div>
    }
  </div>
</div>
